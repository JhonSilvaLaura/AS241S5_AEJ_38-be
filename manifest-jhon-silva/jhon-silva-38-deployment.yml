apiVersion: apps/v1
kind: Deployment
metadata:
  name: jhon-silva-38-deployment
  namespace: jhon-silva-38
  labels:
    app: article-summarizer
    name: jhon-silva-38-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: article-summarizer
      name: jhon-silva-38-deployment
  template:
    metadata:
      labels:
        app: article-summarizer
        name: jhon-silva-38-deployment
    spec:
      containers:
        - name: article-summarizer
          image: jhonbrayansilvalaura/article-summarizer:latest
          ports:
            - containerPort: 8081
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jhon-silva-38-secret
                  key: DATABASE_URL
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: jhon-silva-38-secret
                  key: DATABASE_USERNAME
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jhon-silva-38-secret
                  key: DATABASE_PASSWORD
            - name: RAPIDAPI_KEY
              valueFrom:
                secretKeyRef:
                  name: jhon-silva-38-secret
                  key: RAPIDAPI_KEY
            - name: RAPIDAPI_HOST
              valueFrom:
                secretKeyRef:
                  name: jhon-silva-38-secret
                  key: RAPIDAPI_HOST
            - name: RAPIDAPI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: jhon-silva-38-secret
                  key: RAPIDAPI_BASE_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
