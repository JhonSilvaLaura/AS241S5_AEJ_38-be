# SonarCloud Configuration for Cartoon Generator API (MongoDB)

# Project identification
sonar.projectKey=JhonSilvaLaura_AS241S5_AEJ_38-be-nosql
sonar.organization=jhonsilvalaura

# Project info
sonar.projectName=Cartoon Generator API (MongoDB)
sonar.projectVersion=1.0

# Source code location
sonar.sources=src/main/java
sonar.tests=src/test/java

# Java-specific settings
sonar.java.source=21
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.libraries=target/*.jar

# Coverage reports (JaCoCo)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclude files
sonar.exclusions=**/target/**,**/test/**,**/*.xml,**/*.yml,**/*.yaml,**/*.md

# Encoding
sonar.sourceEncoding=UTF-8

# Analysis parameters
sonar.qualitygate.wait=true
