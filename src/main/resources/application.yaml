spring:
  application:
    name: ai-cartoon-generator
  data:
    mongodb:
      database: ${MONGO_DATABASE}
      uri: ${MONGO_URI}
  codec:
    max-in-memory-size: 10MB

rapidapi:
  key: ${RAPIDAPI_KEY}
  host: ${RAPIDAPI_HOST}
  base-url: ${RAPIDAPI_BASE_URL}
  endpoint-generate: /image/effects/generate_cartoonized_image
  endpoint-result: /api/rapidapi/query-async-task-result

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: 8085